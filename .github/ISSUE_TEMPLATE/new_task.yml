name: Pomysł na nowe zadanie
about: Zaproponuj zadanie lub cały temat
labels: [content]
body:
  - type: dropdown
    id: grade
    attributes:
      label: Klasa
      options: [Klasa 3, Klasa 4, Klasa 5, Klasa 6, Klasa 7, Klasa 8, Kilka klas]
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Temat
      placeholder: Np. bezpieczeństwo, algorytmy, dane
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Treść zadania i poprawna odpowiedź
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Wyjaśnienie dla ucznia
