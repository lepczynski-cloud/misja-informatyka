name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź katalog zadań i kod
        run: npm run validate

      - name: Zbuduj stronę
        run: npm run build

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - name: Przygotuj artefakt Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v5
